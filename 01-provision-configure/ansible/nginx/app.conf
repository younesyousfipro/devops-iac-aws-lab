# nginx site that serves the Angular app (starter kit file, comments added).
# Copied by deploy.yml to /etc/nginx/conf.d/app.conf, which Ubuntu's nginx.conf reads.
# The app is static: compiled HTML, JS and JSON files, no backend. nginx only sends files.

# A server block is one website: the port it listens on and how it answers requests.
# default_server: this site answers every request on port 80, whatever the host name
# (here, requests to the bare public IP). Only one site per port may claim it, which is why
# deploy.yml removes Ubuntu's default site.
# https://nginx.org/en/docs/http/ngx_http_core_module.html#listen
server {
    listen       80 default_server;

    # A location picks the rules for a set of URLs. nginx keeps the longest matching
    # prefix ("/" matches everything), then tries the regex locations (~*) below in order:
    # the first regex that matches wins over the prefix.
    # So this block only handles URLs that are neither .html, nor .js, .css, images or .json:
    # "/" and any other path, such as /foo.
    # https://nginx.org/en/docs/http/ngx_http_core_module.html#location
    #
    # root: the folder that holds the files (the URL is appended to it); deploy.yml copies
    # the app there. index: the file sent for a folder URL such as "/".
    # try_files: send the file if it exists, else the folder, else index.html. Angular
    # handles its routes in the browser, so /foo is no file on disk: nginx sends
    # index.html and Angular shows its own "No corresponding page found", not an nginx 404.
    # https://nginx.org/en/docs/http/ngx_http_core_module.html#try_files
    location / {
      root   /var/www/html/olympic-games-starter;
      index  index.html;
      try_files $uri $uri/ /index.html;
    }

    # HTML pages (and a service worker, sw.js, which this app does not have): never cached.
    # index.html keeps the same name at every build, so a cached copy would keep loading
    # the old JS files after a new deployment. A negative expires sends
    # "Cache-Control: no-cache"; Pragma is the same request for very old HTTP/1.0 caches.
    # https://nginx.org/en/docs/http/ngx_http_headers_module.html#expires
    location ~* (\.html|\/sw\.js)$ {
      root   /var/www/html/olympic-games-starter;
      expires -1y;
      add_header Pragma "no-cache";
    }

    # JS, CSS and images: cached by the browser for one year, never checked again
    # (immutable). Safe for the build files: their name holds a fingerprint of their content
    # (main.342a9ee095d6fddf.js), so a new build has new names and the browser fetches them.
    # JSON is left out: olympic.json keeps its name, so a cached copy would hide new data.
    # https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header
    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
      root   /var/www/html/olympic-games-starter;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
}
