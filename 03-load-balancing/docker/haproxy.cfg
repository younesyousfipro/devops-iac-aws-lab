# HAProxy configuration manual: https://docs.haproxy.org/3.4/configuration.html

# Process-wide settings: connection cap, logs sent to the container output
# https://docs.haproxy.org/3.4/configuration.html#3
global
  maxconn 100
  log stdout format raw local0

# Defaults inherited by every frontend and backend below: HTTP mode, logging, timeouts
# https://docs.haproxy.org/3.4/configuration.html#4
defaults
  mode http
  log global
  option httplog
  timeout client 10s
  timeout connect 5s
  timeout server 10s
  timeout http-request 10s

# Docker's embedded DNS: a restarted container may get a new IP address,
# so server names are resolved again at runtime, not only at startup
# https://docs.haproxy.org/3.4/configuration.html#5.3
resolvers docker
  nameserver dns 127.0.0.11:53

# Frontend: what HAProxy listens on, and where it sends the requests
frontend web
  bind :80
  default_backend app

# Backend: the pool of app servers, served in turn (round robin)
backend app
  balance roundrobin
  # Health check: GET / must answer 200, otherwise the probe counts as a failure
  # https://docs.haproxy.org/3.4/configuration.html#12.9
  option httpchk
  http-check send meth GET uri /
  http-check expect status 200
  # Settings shared by both servers: probe every 2s, down after 3 failures (~6s),
  # back after 2 successes (~4s)
  # https://docs.haproxy.org/3.4/configuration.html#5.2
  default-server check inter 2s fall 3 rise 2 resolvers docker init-addr libc,none
  server web1 webserver1:80
  server web2 webserver2:80
